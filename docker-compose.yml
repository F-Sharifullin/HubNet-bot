services:
  bot:
    build: .
    container_name: hubnet_bot
    restart: always
    env_file:
      - bot/.env
    environment:
      DB_HOST: db #######нужно опдумать что и как 
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - tgnet

#проверен
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data         # ← добавлен
    networks:
      - tgnet
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10  

#проверен
  db:
    image: postgres:16-alpine
    container_name: hubnet_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  tgnet: